<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>연표 정오표 · Cheese Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../admin.css" />
  <link rel="stylesheet" href="timeline-errata.css" />
  <link rel="stylesheet" href="timeline-consistency.css" />
</head>

<body>
  <div class="admin-shell">
    <div id="admin-header-slot"></div>

    <div class="admin-main">
      <aside id="admin-menu-slot" class="admin-sidebar"></aside>

      <main>
        <header class="tc-head">
          <div>
            <h1>연표 정오표</h1>
            <p>포스터 · 워크북 · 1년연표 · 치즈위키(2020~2026)에서 같은 사건끼리 이어 날짜와 내용(숫자·사람·결과)을 맞춰 보고, 다른 곳은 처리 상태와 메모를 남겨요. 상태와 메모는 바꾸면 바로 저장돼요.</p>
          </div>
          <button type="button" class="te-btn primary" id="teAdd">+ 직접 추가</button>
        </header>

        <div class="tc-tabs">
          <button type="button" data-view="cards">사건 카드</button>
          <button type="button" data-view="list">정오표 목록</button>
        </div>

        <div class="tc-chips" id="tcChips"></div>

        <div class="tc-tools">
          <select id="tcYear"><option value="all">모든 해</option></select>
          <input type="search" id="tcSearch" placeholder="사건 이름 검색">
          <span class="tc-msg" id="tcMsg"></span>
        </div>
        <div class="tc-legend" id="tcLegend">
          <span><i class="l-same"></i>날짜·내용 일치</span>
          <span><i class="l-diff"></i>날짜나 내용 불일치</span>
          <span><i class="l-none"></i>한쪽에 없음</span>
          <span>포 = 포스터 · 워 = 워크북 · 1 = 1년연표 · 치 = 치즈위키</span>
        </div>

        <div class="tc-grid" id="tcGrid"><div class="tc-empty">불러오는 중…</div></div>
        <div id="tcList" style="display:none"></div>
      </main>
    </div>
  </div>

  <div class="tc-modal" id="tcModal">
    <div class="tc-modal-box">
      <button type="button" class="tc-x" id="tcClose" aria-label="닫기">×</button>
      <div id="tcModalBody"></div>
    </div>
  </div>

  <div class="te-modal" id="teModal">
    <div class="te-modal-box">
      <h3>정오표 줄 직접 추가</h3>
      <div class="te-field-row">
        <label class="te-field">연도<input name="chart" placeholder="2026"></label>
        <label class="te-field">확인된 날짜<input type="date" name="date"></label>
      </div>
      <label class="te-field">사건<input name="event" placeholder="코스피 9000"></label>
      <label class="te-field">자료에 적힌 것<input name="before" placeholder="6.19 코스피 9000"></label>
      <label class="te-field">확인된 내용<input name="after" placeholder="6.18 처음 9000을 넘겨 마감"></label>
      <label class="te-field">참고<input name="note"></label>
      <label class="te-field">근거 (한 줄에 하나: 주소만, 또는 매체 | 날짜 | 제목 | 주소)<textarea name="sources" rows="3"></textarea></label>
      <div class="te-modal-foot">
        <span class="te-msg" id="teFormMsg"></span>
        <button type="button" class="te-btn" id="teFormClose">닫기</button>
        <button type="button" class="te-btn primary" id="teFormSave">저장</button>
      </div>
    </div>
  </div>

  <script src="../admin-common.js"></script>
  <script src="timeline-consistency-match.js"></script>
  <script src="timeline-consistency-errata.js"></script>
  <script src="timeline-consistency.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.renderAdminHeader) window.renderAdminHeader({ mountId: 'admin-header-slot', badgeText: 'blog', subtitle: '연표 정오표' });
      if (window.renderAdminMenu) window.renderAdminMenu({ mountId: 'admin-menu-slot', active: 'timeline_consistency' });
      if (window.TC_VIEW) window.TC_VIEW.init();
    });
  </script>
</body>

</html>
