<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>연표 관리</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../admin.css" />
<link rel="stylesheet" href="./cjk_timeline.css?v=20260912b" />
</head>
<body>
<div class="admin-shell">
  <div id="admin-header-slot"></div>
  <div class="admin-main">
    <aside id="admin-menu-slot" class="admin-sidebar"></aside>
    <main class="admin-content">

<div class="ct">
  <div class="ct-bar">
    <h2>연표 관리</h2>
    <select id="tlSel" title="연표"></select>
    <span id="dirty" class="ct-dirty"></span>
    <span class="sp"></span>
    <span id="stat" class="ct-muted">불러오는 중…</span>
    <button class="ct-btn" id="btnNew">＋ 새 사건</button>
    <button class="ct-btn" id="btnReset">되돌리기</button>
    <button class="ct-btn pri" id="btnSave" disabled>저장</button>
    <button class="ct-btn" id="btnPub">발행</button>
  </div>

  <div class="ct-wrap">
    <div class="ct-tools">
      <input type="search" id="q" placeholder="사건 이름으로 찾기" />
      <input type="search" id="yq" style="width:200px"
             placeholder="연도 · 날짜 — 1945 · 1945.8 · 1940~50" title="해 한 개(1945) · 달까지(1945.8 · 1945-08-15) · 사이(1940~1950 · 1940~50 · ~1900 · 1990~)" />
      <select id="yrSel"><option value="">시대 전체</option></select>
      <select id="lvSel">
        <option value="">등급 전체</option>
        <option value="1">1급</option>
        <option value="2">2급</option>
        <option value="0">등급 없음</option>
      </select>
      <select id="shareSel">
        <option value="">공유 전체</option>
        <option value="y">다른 연표와 공유</option>
        <option value="n">이 연표에만</option>
      </select>
      <span class="sp" style="flex:1 1 auto"></span>
      <span class="ct-muted" id="count"></span>
    </div>

    <div id="gone"></div>
    <div class="ct-board" id="board"><p class="ct-empty">불러오는 중…</p></div>
  </div>
</div>

<div class="ct-modal" id="pubModal" hidden>
  <div class="box ct">
    <h3>사이트에 반영합니다</h3>
    <div id="pubBox"></div>
    <label style="font-size:13px;font-weight:800;display:block;margin:10px 0 6px">변경 내용 (연표 변경 기록에 그대로 실립니다)</label>
    <textarea id="pubWhy" style="width:100%;min-height:60px"></textarea>
    <p class="ct-hint" style="margin:12px 0 14px">
      발행본과 DB 의 차이만 반영합니다. 독자가 새로고침하면 바로 보입니다.<br>
      반영한 내용은 <a href="/korean/timeline-changelog" target="_blank" rel="noopener">연표 변경 기록</a>에
      「관리창 발행」으로 바로 실립니다. 판 번호는 인쇄본을 다시 만들 때 올라갑니다.
    </p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="ct-btn" id="pubCancel">취소</button>
      <button class="ct-btn pri" id="pubGo">반영하기</button>
    </div>
  </div>
</div>

<div class="ct-modal" id="saveModal" hidden>
  <div class="box ct">
    <h3>저장할 내용</h3>
    <div id="diffBox"></div>
    <label style="font-size:13px;font-weight:800;display:block;margin:10px 0 6px">수정 사유 (변경 기록에 남습니다)</label>
    <textarea id="why" style="width:100%;min-height:76px"></textarea>
    <p class="ct-hint" style="margin:12px 0 14px">
      사건 문서를 바로 수정합니다. 사이트에 반영되는 것은 발행할 때입니다.
    </p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="ct-btn" id="saveCancel">취소</button>
      <button class="ct-btn pri" id="saveGo">저장</button>
    </div>
  </div>
</div>

    </main>
  </div>
</div>
<script src="../admin-common.js"></script>
<script src="./timeline_common.js?v=20260912i"></script>
<script>
(function () {
  'use strict';
  var T = window.TLAdmin, $ = function (id) { return document.getElementById(id); };
  var shown = 80;

  T.guard();
  $('tlSel').innerHTML = T.list.map(function (x) {
    return '<option value="' + x.key + '">' + T.esc(x.name) + '</option>'; }).join('') +
    '<option value="cjk">한중일 비교 (전용 화면)</option>';
  var want = sessionStorage.getItem('tlAdminTl') || 'kr';
  $('tlSel').value = T.of(want) ? want : 'kr';
  load();

  function load() {
    var tl = $('tlSel').value;
    if (tl === 'cjk') { T.go(T.cjkUrl); return; }
    sessionStorage.setItem('tlAdminTl', tl);
    $('stat').textContent = '불러오는 중…';
    $('board').innerHTML = '<p class="ct-empty">사건을 불러오는 중…</p>';
    T.load(tl).then(function (r) {
      $('stat').textContent = T.of(tl).name + ' 사건 ' + r.mine + '건' +
        (r.draft ? ' · 저장 안 한 수정 ' + r.draft + '건' : '');
      fillYears();
      shown = 80;
      draw();
      mark();
    }).catch(function (e) { $('stat').textContent = '오류: ' + e.message; });
  }

  function fillYears() {
    var ys = T.rows().map(function (d) { return T.ymd(T.view(d, T.tl).year)[0]; }).filter(Boolean);
    if (!ys.length) { $('yrSel').innerHTML = '<option value="">시대 전체</option>'; return; }
    var lo = Math.floor(Math.min.apply(null, ys) / 10) * 10, hi = Math.max.apply(null, ys);
    var out = ['<option value="">시대 전체</option>'];
    for (var y = lo; y <= hi; y += 10) out.push('<option value="' + y + '">' + y + '년대</option>');
    $('yrSel').innerHTML = out.join('');
  }

  /* 해 · 날짜로 거르기 — 적는 법 몇 가지를 다 받는다.
       1945            그 해
       1945.8 · 1945-08 · 1945년 8월    그 달
       1945.8.15 · 1945-08-15           그 날
       1940~1950 · 1940~50 · 1940-1950  사이(뒤 두 자리로 적어도 앞자리를 따라간다)
       ~1900 · 1990~                    한쪽만
     못 알아들으면 거르지 않고 칸을 빨갛게 표시한다. */
  function yrTest(raw) {
    var s = String(raw || '').replace(/[년월일]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!s) return { ok: true, fn: null };
    var m, lo, hi;
    if ((m = s.match(/^(\d{1,4})\s*[~–—]\s*(\d{1,4})$/)) ||
        (m = s.match(/^(\d{3,4})\s*-\s*(\d{3,4})$/))) {
      lo = +m[1]; hi = +m[2];
      if (hi < 100) hi = Math.floor(lo / 100) * 100 + hi;    // 1940~50
      if (hi < lo) { var t = lo; lo = hi; hi = t; }
      return { ok: true, fn: function (y) { return y >= lo && y <= hi; } };
    }
    if ((m = s.match(/^[~–—-]\s*(\d{1,4})$/))) {
      hi = +m[1];
      return { ok: true, fn: function (y) { return y && y <= hi; } };
    }
    if ((m = s.match(/^(\d{1,4})\s*[~–—-]$/))) {
      lo = +m[1];
      return { ok: true, fn: function (y) { return y >= lo; } };
    }
    if ((m = s.match(/^(\d{1,4})[.\-\/ ](\d{1,2})(?:[.\-\/ ](\d{1,2}))?$/))) {
      var yy = +m[1], mm = +m[2], dd = m[3] ? +m[3] : 0;
      return { ok: true, fn: function (y, mo, da) {
        return y === yy && mo === mm && (!dd || da === dd); } };
    }
    if ((m = s.match(/^(\d{1,4})$/))) {
      var y0 = +m[1];
      return { ok: true, fn: function (y) { return y === y0; } };
    }
    return { ok: false, fn: null };
  }

  function rows() {
    var q = $('q').value.trim(), yr = $('yrSel').value, lv = $('lvSel').value, sh = $('shareSel').value;
    var yt = yrTest($('yq').value);
    $('yq').style.borderColor = yt.ok ? '' : '#b3261e';
    return T.rows().filter(function (d) {
      var v = T.view(d, T.tl), q2 = T.ymd(v.year), y = q2[0];
      if (T.orig[d.id] !== JSON.stringify(d)) return true;   // 저장 안 한 것은 늘 보인다
      if (yt.fn && !yt.fn(y, q2[1], q2[2])) return false;
      if (q && v.name.indexOf(q) < 0) return false;
      if (yr && !(y >= +yr && y < +yr + 10)) return false;
      if (lv === '0' && d.tier) return false;
      if (lv && lv !== '0' && String(d.tier || '') !== lv) return false;
      var shared = (d.timelines || []).length > 1;
      if (sh === 'y' && !shared) return false;
      if (sh === 'n' && shared) return false;
      return true;
    });
  }

  function draw() {
    drawGone();
    var list = rows();
    $('count').textContent = '사건 ' + T.rows().length + '건 · 보이는 줄 ' + list.length;
    if (!list.length) { $('board').innerHTML = '<p class="ct-empty">조건에 맞는 사건이 없습니다.</p>'; return; }
    var h = '<div class="ct-row ct-head"><span>해</span><span>등급</span><span>사건</span><span style="text-align:right">표시</span></div>';
    list.slice(0, shown).forEach(function (d) {
      var v = T.view(d, T.tl), q = T.ymd(v.year);
      var tags = '';
      if (d.exam >= 3) tags += '<span class="ct-tag lv1">수험 A+</span>';
      else if (d.exam >= 2) tags += '<span class="ct-tag lv2">수험 A</span>';
      else if (d.exam >= 1) tags += '<span class="ct-tag">수험</span>';
      if (v.important) tags += '<span class="ct-tag">굵게</span>';
      if (d.category) tags += '<span class="ct-tag">' + T.esc(d.category) + '</span>';
      var tls = (d.timelines || []);
      tags += tls.length > 1 ? '<span class="ct-tag db">공유 ' + T.esc(tls.join('·')) + '</span>'
                             : '<span class="ct-tag none">이 연표만</span>';
      if (T.isNew(d.id)) tags += '<span class="ct-tag lv1">새 사건</span>';
      else if (T.orig[d.id] !== JSON.stringify(d)) tags += '<span class="ct-tag lv2">수정됨</span>';
      h += '<div class="ct-row" data-id="' + T.esc(d.id) + '">' +
        '<span class="ct-yr">' + q[0] + (q[1] ? '.' + q[1] : '') + '</span>' +
        '<span class="ct-mk' + (d.tier ? '' : ' none') + '"' +
          (d.tier === 1 ? ' style="background:#b3261e"' : d.tier === 2 ? ' style="background:#9a6a10"' : '') + '>' +
          (d.tier ? d.tier : '·') + '</span>' +
        '<span><span class="ct-nm' + (v.important ? ' big' : '') + '">' + T.esc(v.name) + '</span>' +
          '<span class="ct-sub">' + T.esc((d.factions || []).join(' · ')) +
          (v.memo ? ' · 설명 있음' : ' · 설명 없음') +
          (v.over.name || v.over.memo || v.over.year ? ' · 이 연표 전용값 있음' : '') + '</span></span>' +
        '<span class="ct-tags">' + tags + '</span></div>';
    });
    if (list.length > shown) h += '<button class="ct-more" id="more">더 보기 (' + (list.length - shown) + '건 남음)</button>';
    $('board').innerHTML = h;
    var m = $('more');
    if (m) m.onclick = function () { shown += 160; draw(); };
  }

  /* 빼겠다고 표시해 둔 것 — 저장 전에는 여기서 되돌릴 수 있다 */
  function drawGone() {
    var g = T.removedList();
    if (!g.length) { $('gone').innerHTML = ''; return; }
    $('gone').innerHTML = '<div class="ct-doc"><div class="hd"><b>제외 표시한 사건 ' + g.length + '건</b>' +
      '<span class="ct-muted">저장해야 실제로 반영됩니다</span></div>' +
      g.map(function (q) {
        return '<div class="ct-row"><span class="ct-yr">' + T.esc((q.doc.birth_year || '').slice(0, 7)) + '</span>' +
          '<span class="ct-mk none">·</span>' +
          '<span><span class="ct-nm" style="text-decoration:line-through">' + T.esc(q.doc.name || q.id) + '</span>' +
          '<span class="ct-sub">' + (q.mode === 'doc' ? '사건 문서 삭제' : '이 연표에서만 제외') + '</span></span>' +
          '<span style="text-align:right"><button class="ct-btn sm" data-back="' + T.esc(q.id) + '">되돌리기</button></span></div>';
      }).join('') + '</div>';
  }
  $('gone').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-back]');
    if (!b) return;
    T.restore(b.dataset.back);
    draw(); mark();
  });

  /* ── 발행 — 구운 종이와 DB 의 차이를 사이트에 내보낸다 ── */
  var pubDelta = null, pubNew = null;
  $('btnPub').addEventListener('click', function () {
    if (T.dirty().length) { alert('저장하지 않은 수정이 있습니다. 먼저 저장해 주세요.'); return; }
    var btn = this;
    btn.disabled = true; btn.textContent = '비교하는 중…';
    Promise.all([T.paper(T.tl), T.live(T.tl)]).then(function (q) {
      var paper = q[0], live = T.applyLive(paper, q[1]);
      pubDelta = T.delta(paper);          // DB 에 적을 것은 늘 「구운 종이 기준」 한 벌이다
      var d = pubNew = T.delta(live);     // 보여 줄 것은 「현재 사이트 기준」 — 아직 안 나간 것만
      var n = d.add.length + d.set.length + d.del.length;
      var h = '<p class="ct-hint" style="margin:0 0 10px">현재 사이트 ' + live.length +
        '건 ↔ DB ' + T.events().length + '건' +
        (live.length !== paper.length || q[1] ? ' · 발행본 ' + paper.length + '건에 이전 반영분이 더해진 상태입니다' : '') +
        '</p>';
      if (!n) h += '<p class="ct-empty">이미 모두 반영되어 있습니다. 새로 반영할 내용이 없습니다.</p>';
      else {
        h += '<table class="ct-diff"><thead><tr><th style="width:110px">무엇</th><th>사건</th></tr></thead><tbody>';
        d.add.slice(0, 40).forEach(function (e) {
          h += '<tr><td class="b">새로</td><td>' + e.y + (e.m ? '.' + e.m : '') + ' ' + T.esc(e.n) + '</td></tr>'; });
        d.set.slice(0, 40).forEach(function (e) {
          h += '<tr><td>수정됨</td><td>' + e.y + (e.m ? '.' + e.m : '') + ' ' + T.esc(e.n) + '</td></tr>'; });
        d.del.slice(0, 40).forEach(function (k) {
          h += '<tr><td class="a">제외</td><td>' + T.esc(k.replace(/\|/g, ' · ')) + '</td></tr>'; });
        h += '</tbody></table>';
        if (n > 120) h += '<p class="ct-hint">차이가 ' + n + '건입니다 — 이 정도면 인쇄본을 다시 만드는 편이 낫습니다.</p>';
      }
      $('pubBox').innerHTML = h;
      $('pubGo').disabled = !n;
      $('pubModal').hidden = false;
    }).catch(function (e) { alert('발행본을 불러오지 못했습니다: ' + e.message); })
      .then(function () { btn.disabled = false; btn.textContent = '발행'; });
  });
  $('pubCancel').addEventListener('click', function () { $('pubModal').hidden = true; });
  $('pubGo').addEventListener('click', function () {
    var why = $('pubWhy').value.trim();
    if (!why) { alert('무엇을 냈는지 한 줄 적어 주세요.'); return; }
    var btn = this; btn.disabled = true;
    T.publish(pubDelta, pubNew, why).then(function (r) {
      $('pubModal').hidden = true; $('pubWhy').value = '';
      $('stat').textContent = '사이트에 반영했습니다 — 추가 ' + r.n_add + ' · 수정 ' + r.n_set + ' · 제외 ' + r.n_del;
    }).catch(function (e) { alert('반영하지 못했습니다: ' + e.message); })
      .then(function () { btn.disabled = false; });
  });

  $('btnNew').addEventListener('click', function () {
    T.go('./timeline_edit.html?tl=' + encodeURIComponent(T.tl) + '&new=1');
  });

  $('board').addEventListener('click', function (e) {
    var row = e.target.closest('.ct-row[data-id]');
    if (row) T.go('./timeline_edit.html?tl=' + encodeURIComponent(T.tl) + '&id=' + encodeURIComponent(row.dataset.id));
  });
  $('tlSel').addEventListener('change', function () {
    if (T.dirty().length && !confirm('저장하지 않은 수정이 있습니다. 연표를 바꾸면 사라집니다. 계속할까요?')) {
      $('tlSel').value = T.tl; return;
    }
    T.clearDraft(); load();
  });
  ['q', 'yq', 'yrSel', 'lvSel', 'shareSel'].forEach(function (id) {
    $(id).addEventListener('input', function () { shown = 80; draw(); });
    $(id).addEventListener('change', function () { shown = 80; draw(); });
  });
  $('btnReset').addEventListener('click', function () {
    if (T.dirty().length && !confirm('저장하지 않은 수정이 모두 사라집니다. 되돌릴까요?')) return;
    T.clearDraft(); window.__tlLeaving = true; location.reload();
  });
  function mark() {
    var n = T.dirty().length;
    $('dirty').textContent = n ? ('수정 중인 사건 ' + n + '건') : '';
    $('btnSave').disabled = !n;
  }
  $('btnSave').addEventListener('click', function () {
    var bad = T.check();
    if (bad) {
      alert(bad.why + '\n먼저 그 사건을 열어 채워 주세요.');
      T.go('./timeline_edit.html?tl=' + encodeURIComponent(T.tl) + '&id=' + encodeURIComponent(bad.id) +
        (T.isNew(bad.id) ? '&new=1' : ''));
      return;
    }
    var h = '<table class="ct-diff"><thead><tr><th style="width:200px">무엇</th><th>이전</th><th>이후</th></tr></thead><tbody>';
    T.dirty().forEach(function (id) {
      T.diff(id).forEach(function (q) {
        h += '<tr><td>' + T.esc(T.docs[id].name) + ' — ' + T.esc(q.w) + '</td><td class="a">' +
          T.esc(q.a) + '</td><td class="b">' + T.esc(q.b) + '</td></tr>';
      });
    });
    $('diffBox').innerHTML = h + '</tbody></table>';
    $('saveModal').hidden = false;
  });
  $('saveCancel').addEventListener('click', function () { $('saveModal').hidden = true; });
  $('saveGo').addEventListener('click', function () {
    var why = $('why').value.trim();
    if (!why) { alert('수정 사유를 한 줄 적어 주세요.'); return; }
    var btn = this; btn.disabled = true;
    T.save(why).then(function (r) {
      $('saveModal').hidden = true; $('why').value = '';
      $('stat').textContent = '저장했습니다 — 사건 ' + r.n + '건';
      mark(); draw();
    }).catch(function (e) { alert('저장하지 못했습니다: ' + e.message); })
      .then(function () { btn.disabled = false; });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    $('saveModal').hidden = true; $('pubModal').hidden = true;
  });
})();
</script>
</body>
</html>
