<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>한중일 비교 연표 관리</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../admin.css" />
<link rel="stylesheet" href="./cjk_timeline.css" />
</head>
<body>
<div class="admin-shell">
  <div id="admin-header-slot"></div>
  <div class="admin-main">
    <aside id="admin-menu-slot" class="admin-sidebar"></aside>
    <main class="admin-content">

<div class="ct">
  <div class="ct-bar">
    <h2>한중일 비교 연표</h2>
    <select id="edSel" title="세기 판"></select>
    <span id="dirty" class="ct-dirty"></span>
    <span class="sp"></span>
    <span id="stat" class="ct-muted">불러오는 중…</span>
    <button class="ct-btn" id="btnReset">되돌리기</button>
    <button class="ct-btn pri" id="btnSave" disabled>저장</button>
  </div>

  <div class="ct-wrap">
    <nav class="ct-tabs" id="tabs">
      <a data-tab="ev" aria-current="true">사건</a>
      <a data-tab="bar" aria-current="false">나라 띠</a>
      <a data-tab="ron" aria-current="false">실권자 · 군주</a>
      <a data-tab="meta" aria-current="false">판 설명</a>
    </nav>

    <div class="ct-tools">
      <input type="search" id="q" placeholder="사건 이름으로 찾기" />
      <select id="laneSel"><option value="">칸 전체</option></select>
      <select id="lvSel">
        <option value="">등급 전체</option>
        <option value="1">1급</option>
        <option value="2">2급</option>
        <option value="0">등급 없음</option>
      </select>
      <select id="linkSel">
        <option value="">공유 전체</option>
        <option value="y">다른 연표와 공유</option>
        <option value="n">이 연표에만</option>
      </select>
      <button class="ct-btn sm" id="btnNew">+ 새 사건</button>
      <span class="sp" style="flex:1 1 auto"></span>
      <span class="ct-muted" id="count"></span>
    </div>

    <div class="ct-board" id="board"></div>
  </div>
</div>

<div class="ct-modal" id="saveModal" hidden>
  <div class="box ct">
    <h3>저장할 내용</h3>
    <div id="diffBox"></div>
    <label style="font-size:13px;font-weight:800;display:block;margin:10px 0 6px">왜 바꿨는지 (판 기록에 남습니다)</label>
    <textarea id="why" style="width:100%;min-height:76px" placeholder="예: 원본의 오기를 고침 · 사건 이름을 대중 표기로 바꿈"></textarea>
    <p class="ct-hint" style="margin:12px 0 14px">
      판 문서(cjk_timeline)와 함께 쓰는 사건 문서를 한 번에 씁니다. 종이에 나가는 것은 다음 발행 때입니다.
    </p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="ct-btn" id="saveCancel">취소</button>
      <button class="ct-btn pri" id="saveGo">저장</button>
    </div>
  </div>
</div>

<!-- 자료를 읽어 오는 자리 — 발행본과 같은 그림 코드를 들고 있다 -->
<iframe id="frame" src="./cjk_timeline_preview.html" title="자료" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></iframe>

    </main>
  </div>
</div>
<script src="../admin-common.js"></script>
<script src="./cjk_timeline_common.js"></script>
<script>
(function () {
  'use strict';
  var A = window.CJKAdmin, $ = function (id) { return document.getElementById(id); };
  var ed = null, tab = 'ev', shown = 60;

  A.guard();
  A.load($('frame')).then(function (r) {
    $('stat').textContent = (r.saved ? 'DB 저장본 ' + r.saved + '개' : '발행본 자료') +
      (r.draft ? ' · 저장 안 한 고침 ' + r.draft + '개 판' : '');
    $('edSel').innerHTML = A.eds.map(function (e, i) {
      return '<option value="' + e.key + '">' + A.esc(e.cent) + '</option>'; }).join('');
    var want = sessionStorage.getItem('cjkAdminEd') || A.eds[Math.max(0, A.eds.length - 2)].key;
    $('edSel').value = A.edOf(want) ? want : A.eds[0].key;
    pick();
    mark();                      // 초안이 남아 있으면 저장 단추가 켜져 있어야 한다
  }).catch(function (err) { $('stat').textContent = '오류: ' + err.message; });

  function pick() {
    ed = A.edOf($('edSel').value);
    sessionStorage.setItem('cjkAdminEd', ed.key);
    $('laneSel').innerHTML = '<option value="">칸 전체</option>' + (ed.lanes || []).map(function (L) {
      return '<option value="' + L.key + '">' + A.esc(L.name || L.key) + '</option>'; }).join('');
    shown = 60;
    draw();
  }

  function rows() {
    var q = $('q').value.trim(), lane = $('laneSel').value, lv = $('lvSel').value, lk = $('linkSel').value;
    return (ed.ev || []).map(function (e, i) { return { e: e, i: i }; }).filter(function (r) {
      var e = r.e;
      if (lane && e.c !== lane) return false;
      if (q && String(e.n).indexOf(q) < 0) return false;
      if (lv === '0' && e.lv) return false;
      if (lv && lv !== '0' && String(e.lv || '') !== lv) return false;
      if (lk === 'y' && !(e.db && e.db.length)) return false;
      if (lk === 'n' && (e.db && e.db.length)) return false;
      return true;
    });
  }

  function draw() {
    if (tab !== 'ev') { drawOther(); return; }
    var list = rows();
    $('count').textContent = '사건 ' + (ed.ev || []).length + '건 · 보이는 줄 ' + list.length;
    if (!list.length) { $('board').innerHTML = '<p class="ct-empty">조건에 맞는 사건이 없습니다.</p>'; return; }
    var h = '<div class="ct-row ct-head"><span>해</span><span>표식</span><span>사건</span><span style="text-align:right">표시</span></div>';
    list.slice(0, shown).forEach(function (r) {
      var e = r.e, b = e.s ? A.barOf(ed, e.s) : null;
      var tags = '';
      if (e.lv) tags += '<span class="ct-tag lv' + e.lv + '">' + e.lv + '급</span>';
      if (e.i) tags += '<span class="ct-tag">굵게</span>';
      if (e.j) tags += '<span class="ct-tag join">' + (e.j === '/' ? '/ 묶음' : ', 묶음') + '</span>';
      tags += e.db && e.db.length ? '<span class="ct-tag db">공유 ' + e.db.length + '</span>'
                                  : '<span class="ct-tag none">이 연표만</span>';
      h += '<div class="ct-row" data-i="' + r.i + '">' +
        '<span class="ct-yr">' + A.esc(A.yrTxt(e.y)) + '</span>' +
        '<span class="ct-mk' + (b && b.tag ? '' : ' none') + '"' +
          (b && b.tag ? ' style="background:' + A.esc(b.ink || b.bg) + '"' : '') + '>' +
          A.esc(b && b.tag ? b.tag : '·') + '</span>' +
        '<span><span class="ct-nm' + (e.i ? ' big' : '') + '">' + A.esc(e.n) + '</span>' +
          '<span class="ct-sub">' + A.esc(A.laneName(ed, e.c)) +
          ((ed.memo || {})[e.n] ? ' · 설명 있음' : ' · 설명 없음') + '</span></span>' +
        '<span class="ct-tags">' + tags + '</span></div>';
    });
    if (list.length > shown) h += '<button class="ct-more" id="more">더 보기 (' + (list.length - shown) + '건 남음)</button>';
    $('board').innerHTML = h;
    var m = $('more');
    if (m) m.onclick = function () { shown += 120; draw(); };
  }

  /* 띠 · 사람 · 판 설명은 줄이 적어 목록에서 바로 고친다 */
  function drawOther() {
    var h = '', n = 0;
    if (tab === 'bar') {
      Object.keys(ed.bars || {}).forEach(function (lane) {
        Object.keys(ed.bars[lane]).forEach(function (tk) {
          (ed.bars[lane][tk] || []).forEach(function (b, bi) {
            if ($('laneSel').value && $('laneSel').value !== lane) return;
            if ($('q').value.trim() && b.n.indexOf($('q').value.trim()) < 0) return;
            n++;
            var k = lane + '|' + tk + '|' + bi;
            h += '<div class="ct-row" style="grid-template-columns:1fr;cursor:default;gap:8px">' +
              '<div class="ct-f">' +
                '<label>이름</label><input type="text" data-b="' + k + '" data-f="n" value="' + A.esc(b.n) + '">' +
                '<label>기간</label><div class="row">' +
                  '<input type="number" step="0.01" style="width:110px" data-b="' + k + '" data-f="f" value="' + b.f + '">' +
                  '<span class="ct-muted">~</span>' +
                  '<input type="number" step="0.01" style="width:110px" data-b="' + k + '" data-f="t" value="' + b.t + '">' +
                  '<span class="ct-muted">' + A.esc(lane) + ' · ' + A.esc(tk) + '</span></div>' +
                '<label>폭(해:비율)</label><input type="text" data-b="' + k + '" data-f="w" value="' + A.esc(A.wTxt(b.w)) + '" placeholder="1912.12:1, 1949.75:0.46">' +
                '<label>자리 · 표식</label><div class="row">' +
                  sel('b', k, 'align', b.align || '', [['', '왼쪽'], ['right', '오른쪽'], ['center', '가운데']]) +
                  sel('b', k, 'side', b.side || '', [['', '기본 차례'], ['left', '주 띠 왼쪽']]) +
                  '<input type="text" style="width:70px" data-b="' + k + '" data-f="tag" value="' + A.esc(b.tag || '') + '" placeholder="표식">' +
                '</div>' +
              '</div></div>';
          });
        });
      });
      $('count').textContent = '띠 ' + n + '개';
    } else if (tab === 'ron') {
      Object.keys(ed.rulers_on || {}).forEach(function (lane) {
        Object.keys(ed.rulers_on[lane]).forEach(function (tk) {
          (ed.rulers_on[lane][tk] || []).forEach(function (r, ri) {
            if ($('laneSel').value && $('laneSel').value !== lane) return;
            if ($('q').value.trim() && String(r.p || r.n).indexOf($('q').value.trim()) < 0) return;
            n++;
            var k = lane + '|' + tk + '|' + ri;
            h += '<div class="ct-row" style="grid-template-columns:1fr;cursor:default;gap:8px">' +
              '<div class="ct-f">' +
                '<label>이름</label><div class="row">' +
                  '<input type="text" style="width:130px" data-r="' + k + '" data-f="p" value="' + A.esc(r.p || '') + '">' +
                  '<span class="ct-muted">' + A.esc(lane) + ' · ' + A.esc(r.on) + '</span></div>' +
                '<label>자세한 이름</label><input type="text" data-r="' + k + '" data-f="n" value="' + A.esc(r.n || '') + '">' +
                '<label>재임</label><div class="row">' +
                  '<input type="number" step="0.01" style="width:110px" data-r="' + k + '" data-f="f" value="' + r.f + '">' +
                  '<span class="ct-muted">~</span>' +
                  '<input type="number" step="0.01" style="width:110px" data-r="' + k + '" data-f="t" value="' + r.t + '"></div>' +
                '<label>종이에서</label><div class="row">' +
                  '<label class="chk"><input type="checkbox" data-r="' + k + '" data-f="keep"' + (r.keep ? ' checked' : '') + '> 반드시 표시</label>' +
                  '<label class="chk"><input type="checkbox" data-r="' + k + '" data-f="drop"' + (r.drop ? ' checked' : '') + '> 뺀다</label></div>' +
              '</div></div>';
          });
        });
      });
      $('count').textContent = '사람 ' + n + '명';
    } else {
      h = '<div class="ct-row" style="grid-template-columns:1fr;cursor:default"><div class="ct-f">' +
        '<label>세기 이름</label><input type="text" data-m="cent" value="' + A.esc(ed.cent) + '">';
      (ed.book || []).forEach(function (q, i) {
        h += '<label>' + (i + 1) + '장 소개</label><input type="text" data-m="book' + i + '" value="' + A.esc(q) + '">' +
          '<label>' + (i + 1) + '장 설명</label><textarea data-m="desc' + i + '" style="min-height:72px">' + A.esc((ed.desc || [])[i] || '') + '</textarea>';
      });
      h += '</div></div>';
      $('count').textContent = '';
    }
    $('board').innerHTML = h || '<p class="ct-empty">보일 것이 없습니다.</p>';
  }
  function sel(kind, k, f, v, opts) {
    return '<select data-' + kind + '="' + k + '" data-f="' + f + '">' + opts.map(function (o) {
      return '<option value="' + A.esc(o[0]) + '"' + (String(o[0]) === String(v) ? ' selected' : '') + '>' +
        A.esc(o[1]) + '</option>'; }).join('') + '</select>';
  }

  /* ── 조작 ── */
  $('board').addEventListener('click', function (e) {
    var row = e.target.closest('.ct-row[data-i]');
    if (row) A.go('./cjk_timeline_edit.html?ed=' + encodeURIComponent(ed.key) + '&i=' + row.dataset.i);
  });
  $('board').addEventListener('input', onEdit);
  $('board').addEventListener('change', onEdit);
  function onEdit(e) {
    var t = e.target, f = t.dataset.f;
    if (t.dataset.m) {
      var m = t.dataset.m;
      if (m === 'cent') ed.cent = t.value;
      else if (m.indexOf('book') === 0) ed.book[+m.slice(4)] = t.value;
      else if (m.indexOf('desc') === 0) ed.desc[+m.slice(4)] = t.value;
    } else if (t.dataset.b && f) {
      var k = t.dataset.b.split('|'), b = ed.bars[k[0]][k[1]][+k[2]];
      if (f === 'f' || f === 't') b[f] = parseFloat(t.value);
      else if (f === 'w') { var w = A.wParse(t.value); if (w) b.w = w; else delete b.w; }
      else if (t.value === '') delete b[f]; else b[f] = t.value;
    } else if (t.dataset.r && f) {
      var q = t.dataset.r.split('|'), r = ed.rulers_on[q[0]][q[1]][+q[2]];
      if (f === 'f' || f === 't') r[f] = parseFloat(t.value);
      else if (f === 'keep' || f === 'drop') { if (t.checked) r[f] = 1; else delete r[f]; }
      else if (t.value === '') delete r[f]; else r[f] = t.value;
    } else return;
    A.saveDraft(); mark();
  }
  $('tabs').addEventListener('click', function (e) {
    var a = e.target.closest('[data-tab]');
    if (!a) return;
    tab = a.dataset.tab;
    [].forEach.call(this.children, function (x) { x.setAttribute('aria-current', String(x.dataset.tab === tab)); });
    draw();
  });
  ['q', 'laneSel', 'lvSel', 'linkSel'].forEach(function (id) {
    $(id).addEventListener('input', function () { shown = 60; draw(); });
    $(id).addEventListener('change', function () { shown = 60; draw(); });
  });
  $('edSel').addEventListener('change', pick);
  $('btnNew').addEventListener('click', function () {
    var lane = $('laneSel').value || (ed.lanes[0] || {}).key;
    ed.ev.push({ c: lane, y: Math.floor((ed.y0 + ed.y1) / 2), n: '새 사건' });
    ed.ev.sort(function (a, b) { return a.y - b.y; });
    A.saveDraft();
    var i = ed.ev.findIndex(function (e) { return e.n === '새 사건'; });
    A.go('./cjk_timeline_edit.html?ed=' + encodeURIComponent(ed.key) + '&i=' + i);
  });
  $('btnReset').addEventListener('click', function () {
    if (A.dirtyCount() && !confirm('저장하지 않은 고침이 모두 사라집니다. 되돌릴까요?')) return;
    A.clearDraft();
    window.__cjkLeaving = true;
    location.reload();
  });

  function mark() {
    var n = A.dirtyCount();
    $('dirty').textContent = n ? ('저장 안 한 고침 ' + n + '곳') : '';
    $('btnSave').disabled = !n;
  }
  $('btnSave').addEventListener('click', function () {
    var h = '';
    A.dirtyEds().forEach(function (e) {
      var items = A.diff(e.key);
      h += '<h4 style="margin:10px 0 4px;font-size:13px">' + A.esc(e.cent) + ' <span class="ct-muted">(' + items.length + '곳)</span></h4>' +
        '<table class="ct-diff"><thead><tr><th style="width:120px">무엇</th><th>이전</th><th>이후</th></tr></thead><tbody>' +
        items.slice(0, 200).map(function (q) {
          return '<tr><td>' + A.esc(q.w) + '</td><td class="a">' + A.esc(q.a || '') + '</td><td class="b">' + A.esc(q.b || '') + '</td></tr>';
        }).join('') + '</tbody></table>';
    });
    var docs = A.dirtyDocs();
    if (docs.length) {
      h += '<h4 style="margin:10px 0 4px;font-size:13px">함께 쓰는 사건 문서 ' + docs.length + '건</h4><table class="ct-diff"><tbody>';
      docs.forEach(function (id) {
        A.docDiff(id).forEach(function (q) {
          h += '<tr><td>' + A.esc(A.docs[id].name || id) + ' — ' + A.esc(q.w) + '</td><td class="a">' +
            A.esc(q.a) + '</td><td class="b">' + A.esc(q.b) + '</td></tr>';
        });
      });
      h += '</tbody></table>';
    }
    $('diffBox').innerHTML = h || '<p class="ct-muted">바뀐 곳을 찾지 못했습니다.</p>';
    $('saveModal').hidden = false;
  });
  $('saveCancel').addEventListener('click', function () { $('saveModal').hidden = true; });
  $('saveGo').addEventListener('click', function () {
    var why = $('why').value.trim();
    if (!why) { alert('왜 바꿨는지 한 줄 적어 주세요. 판 기록에 들어갑니다.'); return; }
    var btn = this; btn.disabled = true;
    A.save(why).then(function (r) {
      $('saveModal').hidden = true; $('why').value = '';
      $('stat').textContent = '저장했습니다 — 판 ' + r.eds + ' · 사건 문서 ' + r.docs;
      mark();
    }).catch(function (err) { alert('저장하지 못했습니다: ' + err.message); })
      .then(function () { btn.disabled = false; });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('saveModal').hidden = true; });
})();
</script>
</body>
</html>
