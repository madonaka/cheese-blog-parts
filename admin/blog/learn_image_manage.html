<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>학습 본문 이미지 · Cheese Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../admin.css" />
  <script src="../admin-common.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    window.CHEESE_ADMIN_ACTIVE_PAGE = "learn_image_manage";
    window.CHEESE_ADMIN_PAGE_SUBTITLE = "학습 본문 이미지";
  </script>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --sub: #64748b;
      --line: rgba(15,23,42,0.08);
      --shadow: 0 10px 25px -5px rgba(15,23,42,0.04), 0 8px 10px -6px rgba(15,23,42,0.04);
      --r: 16px; --accent: #0f766e; --accent-light: #ccfbf1;
    }
    .im-wrap { padding: 24px; max-width: 1320px; margin: 0 auto; }
    .im-title-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
    .im-title { font-size:24px; font-weight:900; color:var(--text); margin:0; display:flex; align-items:center; gap:10px; }
    .im-title i { color: var(--accent); }
    .im-lead { font-size:13px; color:var(--sub); line-height:1.7; margin:0 0 18px; }
    .im-lead code { background:#f1f5f9; padding:1px 6px; border-radius:5px; font-size:12px; }

    /* 요약 숫자 */
    .im-stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
    .im-stat { background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px; }
    .im-stat-k { font-size:11px; font-weight:800; color:var(--sub); letter-spacing:0.02em; }
    .im-stat-v { font-size:22px; font-weight:900; color:var(--text); margin-top:4px; }
    .im-stat-v small { font-size:12px; font-weight:700; color:var(--sub); margin-left:3px; }
    .im-stat.warn .im-stat-v { color:#b45309; }

    /* 도구 줄 */
    .im-bar {
      background:var(--card); border-radius:var(--r); border:1px solid var(--line); box-shadow:var(--shadow);
      padding:14px 16px; display:flex; gap:10px 12px; align-items:center; margin-bottom:18px; flex-wrap:wrap;
    }
    .im-search-wrap { position:relative; flex:1; min-width:220px; }
    .im-search-wrap i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--sub); }
    .im-search { width:100%; padding:10px 14px 10px 40px; border:1.5px solid var(--line); border-radius:10px; font-size:14px; box-sizing:border-box; font-family:inherit; }
    .im-search:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-light); }
    .im-select { padding:10px 14px; border:1.5px solid var(--line); border-radius:10px; font-size:14px; background:#fff; cursor:pointer; font-family:inherit; max-width:280px; }
    .im-select:focus { border-color:var(--accent); outline:none; }
    .im-chk { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer; white-space:nowrap; }
    .im-count { font-size:12px; color:var(--sub); margin-left:auto; white-space:nowrap; }

    /* 이미지 격자 */
    .im-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
    .im-card { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; }
    .im-thumb { height:150px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:zoom-in; }
    .im-thumb img { max-width:100%; max-height:150px; display:block; }
    .im-thumb .im-noimg { color:#cbd5e1; font-size:28px; }
    .im-body { padding:11px 12px 12px; display:flex; flex-direction:column; gap:7px; }
    .im-badges { display:flex; flex-wrap:wrap; gap:5px; }
    .im-badge { font-size:10px; font-weight:800; padding:2px 8px; border-radius:999px; background:#f1f5f9; color:var(--sub); }
    .im-badge.use { background:var(--accent-light); color:#0f766e; }
    .im-badge.multi { background:#fef3c7; color:#b45309; }
    .im-badge.sticker { background:#e0e7ff; color:#3730a3; }
    .im-badge.big { background:#fee2e2; color:#991b1b; }
    .im-meta { font-size:11px; color:var(--sub); line-height:1.6; word-break:break-all; }
    .im-uses { border-top:1px dashed var(--line); padding-top:8px; margin-top:1px; }
    .im-uses-btn {
      width:100%; text-align:left; border:none; background:transparent; padding:0; cursor:pointer;
      font:inherit; font-size:12px; font-weight:800; color:var(--accent); display:flex; align-items:center; gap:6px;
    }
    .im-use-list { margin-top:7px; display:flex; flex-direction:column; gap:6px; }
    .im-use {
      font-size:11.5px; line-height:1.5; color:var(--text); background:#f8fafc;
      border:1px solid var(--line); border-radius:8px; padding:6px 8px; text-decoration:none; display:block;
    }
    .im-use:hover { border-color:var(--accent); }
    .im-use-seq { font-weight:800; color:var(--sub); font-size:10.5px; }
    .im-use-txt { color:var(--text); }

    .im-empty { padding:60px 20px; text-align:center; color:var(--sub); font-size:14px; }
    .im-state { padding:50px 20px; text-align:center; color:var(--sub); font-size:14px; }

    /* 크게 보기 */
    .im-lb { position:fixed; inset:0; background:rgba(15,23,42,0.82); display:none; align-items:center; justify-content:center; z-index:1300; padding:24px; }
    .im-lb.open { display:flex; }
    .im-lb img { max-width:92vw; max-height:86vh; border-radius:10px; background:#fff; }
    .im-lb-close { position:absolute; top:18px; right:22px; background:rgba(255,255,255,0.15); color:#fff; border:none; border-radius:10px; width:40px; height:40px; font-size:18px; cursor:pointer; }
  </style>
</head>

<body>
<div class="admin-shell">
  <div id="admin-header-slot"></div>
  <div class="admin-main">
    <aside id="admin-menu-slot" class="admin-sidebar"></aside>
    <main class="admin-content">
      <div class="im-wrap">
        <div class="im-title-row">
          <h2 class="im-title"><i class="fa-solid fa-images"></i> 학습 본문 이미지</h2>
        </div>
        <p class="im-lead">
          마이크로 학습의 청크에 붙어 있는 그림을 한자리에 모아 봅니다. <strong>보기 전용</strong>이라 여기서 바꾸거나 지우지 않습니다 —
          고치려면 카드의 사용처를 눌러 해당 편의 청크 편집기로 가세요.<br>
          같은 그림이 여러 청크에 쓰이는 경우가 있어, <strong>하나를 바꾸면 어디가 함께 바뀌는지</strong> 여기서 먼저 확인할 수 있습니다.
          그림 주소의 <code>sz=w숫자</code>는 구글 드라이브에서 받아 오는 가로 픽셀입니다.
        </p>

        <div class="im-stats" id="im-stats"></div>

        <div class="im-bar">
          <div class="im-search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input class="im-search" id="im-search" placeholder="편 제목·청크 본문으로 검색..." oninput="renderImages()">
          </div>
          <select class="im-select" id="im-seq" onchange="renderImages()"><option value="">전체 편</option></select>
          <select class="im-select" id="im-sort" onchange="renderImages()">
            <option value="uses">사용 많은 순</option>
            <option value="seq">편 순서대로</option>
            <option value="sz">받아 오는 크기 큰 순</option>
          </select>
          <label class="im-chk"><input type="checkbox" id="im-multi" onchange="renderImages()"> 여러 곳에 쓰인 것만</label>
          <label class="im-chk"><input type="checkbox" id="im-nosticker" onchange="renderImages()"> 스티커 제외</label>
          <span class="im-count" id="im-count"></span>
        </div>

        <div class="im-grid" id="im-grid"></div>
        <div class="im-state" id="im-state"><i class="fa-solid fa-spinner fa-spin"></i> 학습 데이터를 불러오는 중...</div>
        <div class="im-empty" id="im-empty" style="display:none;">조건에 맞는 그림이 없습니다.</div>
      </div>
    </main>
  </div>
</div>

<div class="im-lb" id="im-lb" onclick="closeLightbox(event)">
  <button type="button" class="im-lb-close" onclick="closeLightbox(event)">✕</button>
  <img id="im-lb-img" src="" alt="">
</div>

<script>
  async function safeFetchDB(payload) {
    if (!window.CHEESE_ADMIN_DB_API) throw new Error("API 엔드포인트가 정의되지 않았습니다.");
    const res = await fetch(window.CHEESE_ADMIN_DB_API, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Token": window.CHEESE_ADMIN_TOKEN || "" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Firebase 오류");
    return data;
  }

  function escHtml_(s) {
    return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escAttr_(s) { return escHtml_(s).replace(/"/g, "&quot;"); }

  /* 그림 하나를 나타내는 항목:
     { url, uses:[{seqId, seqTitle, seqOrder, stepIdx, text, style}], isSticker, sz, w, h }
     같은 주소를 여러 청크가 쓰면 항목 하나에 uses가 쌓인다 — 이 페이지의 핵심이다. */
  let IMAGES = [];
  let SEQ_LIST = [];

  const szOf = (url) => (String(url).match(/[?&]sz=([^&]+)/) || [, ""])[1];
  // 'w1200' → 1200 (정렬용). 숫자가 없으면 0.
  const szNum = (sz) => parseInt(String(sz).replace(/\D/g, ""), 10) || 0;

  /* 격자 썸네일은 작게 받는다. 저장된 주소를 그대로 쓰면 w1200(장당 170KB 안팎)을
     378장 받게 되어 이 페이지만 수십 MB가 된다. 크게 볼 때만 원본 주소로 연다. */
  function thumbUrl_(url, px) {
    const u = String(url || "");
    if (!/drive\.google\.com\/thumbnail/.test(u)) return u;
    return u.replace(/([?&]sz=)[^&]*/, `$1w${px}`);
  }

  async function loadAll() {
    try {
      const [seqRes, stkRes] = await Promise.all([
        safeFetchDB({ action: "get", collection: "learn_sequences" }),
        safeFetchDB({ action: "get", collection: "learn_stickers" }).catch(() => ({ data: [] }))
      ]);
      const seqs = seqRes.data || [];
      const stickerUrls = new Set((stkRes.data || []).map(s => String(s.url || "").trim()).filter(Boolean));

      SEQ_LIST = seqs
        .map(s => ({ id: s.id, title: s.title || "(제목 없음)", order: s.series_order ?? 9999, series: s.series_name || s.group || "" }))
        .sort((a, b) => String(a.series).localeCompare(String(b.series)) || a.order - b.order);

      const map = new Map();
      seqs.forEach(s => {
        (s.steps || []).forEach((st, i) => {
          const url = String(st.image_url || "").trim();
          if (!url) return;
          if (!map.has(url)) {
            map.set(url, { url, uses: [], isSticker: stickerUrls.has(url), sz: szOf(url), w: 0, h: 0 });
          }
          map.get(url).uses.push({
            seqId: s.id,
            seqTitle: s.title || "(제목 없음)",
            seqOrder: s.series_order ?? 9999,
            stepIdx: i,
            text: String(st.text || "").replace(/\s+/g, " ").trim().slice(0, 60),
            style: st.share_style || ""
          });
        });
      });
      IMAGES = [...map.values()];

      const seqSel = document.getElementById("im-seq");
      SEQ_LIST.forEach(s => {
        // 그림이 하나도 없는 편은 고를 이유가 없다
        if (!IMAGES.some(im => im.uses.some(u => u.seqId === s.id))) return;
        const o = document.createElement("option");
        o.value = s.id;
        o.textContent = s.title.slice(0, 34);
        seqSel.appendChild(o);
      });

      document.getElementById("im-state").style.display = "none";
      renderStats();
      renderImages();
    } catch (e) {
      document.getElementById("im-state").innerHTML =
        `<span style="color:#dc2626;"><i class="fa-solid fa-triangle-exclamation"></i> 불러오지 못했습니다: ${escHtml_(e.message)}</span>`;
    }
  }

  function renderStats() {
    const totalUses = IMAGES.reduce((n, im) => n + im.uses.length, 0);
    const multi = IMAGES.filter(im => im.uses.length > 1);
    const seqSet = new Set();
    IMAGES.forEach(im => im.uses.forEach(u => seqSet.add(u.seqId)));
    const stickers = IMAGES.filter(im => im.isSticker).length;
    const bySz = {};
    IMAGES.forEach(im => { bySz[im.sz || "(없음)"] = (bySz[im.sz || "(없음)"] || 0) + 1; });
    const szText = Object.entries(bySz).sort((a, b) => b[1] - a[1])
      .map(([k, v]) => `${k} ${v}`).join(" · ");

    document.getElementById("im-stats").innerHTML = `
      <div class="im-stat"><div class="im-stat-k">서로 다른 그림</div><div class="im-stat-v">${IMAGES.length}<small>장</small></div></div>
      <div class="im-stat"><div class="im-stat-k">붙어 있는 청크</div><div class="im-stat-v">${totalUses}<small>개</small></div></div>
      <div class="im-stat"><div class="im-stat-k">그림이 있는 편</div><div class="im-stat-v">${seqSet.size}<small>편</small></div></div>
      <div class="im-stat ${multi.length ? "warn" : ""}"><div class="im-stat-k">여러 곳에 쓰인 그림</div><div class="im-stat-v">${multi.length}<small>장</small></div></div>
      <div class="im-stat"><div class="im-stat-k">스티커 함 그림</div><div class="im-stat-v">${stickers}<small>장</small></div></div>
      <div class="im-stat"><div class="im-stat-k">받아 오는 크기</div><div class="im-stat-v" style="font-size:14px;line-height:1.5;">${escHtml_(szText)}</div></div>`;
  }

  function renderImages() {
    const grid = document.getElementById("im-grid");
    const empty = document.getElementById("im-empty");
    if (!grid) return;

    const q = (document.getElementById("im-search")?.value ?? "").trim().toLowerCase();
    const seqId = document.getElementById("im-seq")?.value ?? "";
    const sort = document.getElementById("im-sort")?.value ?? "uses";
    const multiOnly = document.getElementById("im-multi")?.checked;
    const noSticker = document.getElementById("im-nosticker")?.checked;

    let list = IMAGES.filter(im => {
      if (multiOnly && im.uses.length < 2) return false;
      if (noSticker && im.isSticker) return false;
      if (seqId && !im.uses.some(u => u.seqId === seqId)) return false;
      if (!q) return true;
      return im.uses.some(u => `${u.seqTitle} ${u.text}`.toLowerCase().includes(q));
    });

    if (sort === "uses") list.sort((a, b) => b.uses.length - a.uses.length);
    else if (sort === "sz") list.sort((a, b) => szNum(b.sz) - szNum(a.sz) || b.uses.length - a.uses.length);
    else list.sort((a, b) => (a.uses[0]?.seqOrder ?? 0) - (b.uses[0]?.seqOrder ?? 0) || (a.uses[0]?.stepIdx ?? 0) - (b.uses[0]?.stepIdx ?? 0));

    document.getElementById("im-count").textContent = `${list.length}장 / 전체 ${IMAGES.length}장`;
    empty.style.display = list.length ? "none" : "block";

    grid.innerHTML = list.map((im, n) => {
      const seqCount = new Set(im.uses.map(u => u.seqId)).size;
      const badges = [
        `<span class="im-badge use">${im.uses.length}개 청크</span>`,
        seqCount > 1 ? `<span class="im-badge multi">${seqCount}개 편에 걸침</span>` : "",
        im.isSticker ? `<span class="im-badge sticker">스티커 함</span>` : "",
        im.sz ? `<span class="im-badge">${escHtml_(im.sz)}</span>` : ""
      ].filter(Boolean).join("");

      const uses = im.uses.map(u => `
        <a class="im-use" href="/admin/blog/learn_manage.html?id=${encodeURIComponent(u.seqId)}" target="_blank"
           title="이 편의 청크 편집기로 이동">
          <span class="im-use-seq">${escHtml_(u.seqTitle.slice(0, 26))} · ${u.stepIdx + 1}번 청크${u.style ? " · " + escHtml_(u.style) : ""}</span><br>
          <span class="im-use-txt">${escHtml_(u.text) || "(본문 없음)"}</span>
        </a>`).join("");

      const over = szNum(im.sz) >= 900;
      return `
        <div class="im-card">
          <div class="im-thumb" onclick="openLightbox('${escAttr_(im.url)}')" title="눌러서 원본 크기로 보기">
            <img src="${escAttr_(thumbUrl_(im.url, 320))}" alt="" loading="lazy"
                 onerror="this.outerHTML='<i class=\\'fa-solid fa-image im-noimg\\'></i>'">
          </div>
          <div class="im-body">
            <div class="im-badges">${badges}</div>
            <div class="im-meta">뷰어가 받는 크기 ${escHtml_(im.sz || "지정 없음")}${
              over ? ` <span class="im-badge big">본문 표시(최대 340px)보다 큼</span>` : ""}</div>
            <div class="im-uses">
              <button type="button" class="im-uses-btn" onclick="toggleUses(this)">
                <i class="fa-solid fa-chevron-right"></i> 사용처 ${im.uses.length}곳 보기
              </button>
              <div class="im-use-list" style="display:none;">${uses}</div>
            </div>
          </div>
        </div>`;
    }).join("");

  }

  function toggleUses(btn) {
    const list = btn.nextElementSibling;
    const open = list.style.display !== "none";
    list.style.display = open ? "none" : "flex";
    btn.querySelector("i").className = open ? "fa-solid fa-chevron-right" : "fa-solid fa-chevron-down";
  }

  function openLightbox(url) {
    document.getElementById("im-lb-img").src = url;
    document.getElementById("im-lb").classList.add("open");
  }
  function closeLightbox(e) {
    if (e && e.target && e.target.tagName === "IMG" && e.target.id === "im-lb-img") return;
    document.getElementById("im-lb").classList.remove("open");
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });

  document.addEventListener("DOMContentLoaded", loadAll);
</script>
</body>
</html>
