<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>한중일 연표 미리보기 (관리자용)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  관리 화면이 iframe 으로 띄우는 미리보기다. 발행본과 **같은 그림 코드**를 그대로 불러다 쓴다.
    /korean/cjk-timeline-data.js  자료(EDITIONS)
    /korean/cjk-timeline.js       그리기
  보는 법은 여기서 따로 만든다 — 끌어서 이동 · 휠로 확대 · 폭 맞춤 · 두 번 눌러 오가기.
  관리 화면은 window.CJK.read() · sheets() · apply() · show() 를 쓴다.
-->
<link rel="stylesheet" href="https://plus.cheesehistory.com/korean/cjk-timeline.css?v=20260912b">
<style>
  html,body{margin:0;height:100%;background:#efece4;font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden}
  /* 발행본 화면 요소는 걷고 종이만 남긴다 */
  .kmt .wrap,.kmt .zoom-bar,.kmt .zoom-dock,.kmt .zoom-nav{display:none !important}
  .kmt .zoomview{position:static !important;display:block !important;background:transparent !important;z-index:auto !important}
  .kmt .zoom-scroll{overflow:visible !important}
  .kmt .zoom-inner{margin:0 !important}
  .kmt .a4{box-shadow:0 8px 26px rgba(0,0,0,.22)}

  #stage{position:absolute;inset:38px 0 0;overflow:auto;cursor:grab;
         overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#efece4}
  #stage.drag{cursor:grabbing}
  #pad{padding:12px}
  /* 조작 줄 — 위에 붙여 둔다 */
  #bar{position:absolute;left:0;right:0;top:0;height:38px;display:flex;align-items:center;gap:6px;
       padding:0 10px;background:#fff;border-bottom:1px solid #e3e7ec;font-size:12px;color:#6b7684}
  #bar button{font:inherit;font-size:12px;font-weight:800;border:1px solid #e3e7ec;background:#fff;
              border-radius:8px;padding:4px 9px;cursor:pointer;color:#33404d}
  #bar button:hover{background:#f6f8fa}
  #bar b{font-variant-numeric:tabular-nums;min-width:46px;text-align:center;color:#33404d}
  #bar .sp{flex:1 1 auto}
  #err{margin:12px;padding:11px 13px;border:1px solid #f0c2c2;border-radius:10px;background:#fff6f6;
       color:#a3352b;font-size:13px;line-height:1.6;display:none}
</style>
</head>
<body>
<div id="bar">
  <button type="button" id="zOutB" title="줄이기">−</button>
  <b id="pct">100%</b>
  <button type="button" id="zInB" title="키우기">+</button>
  <button type="button" id="zFitB" title="폭에 맞추기">폭 맞춤</button>
  <button type="button" id="zOneB" title="실제 크기">100%</button>
  <span class="sp"></span>
  <span id="tip">끌어서 옮기고, 휠로 오르내립니다 · Ctrl+휠로 확대</span>
</div>
<div id="stage"><div id="pad">
  <div id="err"></div>
  <div class="kmt">
    <div class="wrap">
      <div class="bar"><span class="seg-lb">장</span><div class="seg" id="segSheet"></div></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="zoomview is-on" id="zoomview">
      <div class="zoom-bar">
        <button type="button" id="zClose">✕</button>
        <b id="zTitle"></b><span id="zRange"></span><span id="zPageNo"></span>
        <span class="sp"></span><span id="zSlack" hidden></span>
      </div>
      <div class="zoom-scroll" id="zScroll"><div class="zoom-inner" id="zInner"></div></div>
      <button type="button" class="zoom-nav prev" id="zPrev">‹</button>
      <button type="button" class="zoom-nav next" id="zNext">›</button>
      <div class="zoom-dock"><div class="zd">
        <button type="button" id="zOut">−</button><i id="zPct">100%</i>
        <button type="button" id="zIn">+</button><button type="button" id="zFit">⤢</button>
      </div></div>
    </div>
    <div class="etl-info-modal" id="evtModal" hidden>
      <div class="etl-info-card"><button type="button" class="etl-info-close" data-evtclose>✕</button>
        <div class="etl-info-meta" id="evtMeta"></div><h3 class="etl-info-title" id="evtTitle"></h3>
        <div class="etl-info-body" id="evtBody"></div></div>
    </div>
  </div>
</div></div>

<script src="https://plus.cheesehistory.com/korean/cjk-timeline-data.js?v=20260912f"></script>
<script src="https://plus.cheesehistory.com/korean/cjk-timeline.js?v=20260912f"></script>
<script>
(function () {
  'use strict';
  var ready = typeof EDITIONS !== 'undefined' && typeof openPage === 'function';
  if (!ready) {
    var e = document.getElementById('err');
    e.style.display = 'block';
    e.textContent = '연표 그림 코드를 불러오지 못했습니다. plus.cheesehistory.com 이 열려 있는지 확인해 주세요.';
    return;
  }
  var stage = document.getElementById('stage');
  var pct = document.getElementById('pct');
  var scale = 1, fitScale = 1, curPage = 0;

  function paper() { return document.getElementById('a4'); }
  function put(s) {
    var a4 = paper(); if (!a4) return;
    var w = a4.offsetWidth || 1750, h = a4.offsetHeight || 2475;
    scale = Math.max(0.05, Math.min(3, s));
    a4.style.transformOrigin = 'top left';
    a4.style.transform = 'scale(' + scale + ')';
    var inner = document.getElementById('zInner');
    inner.style.width = (w * scale) + 'px';
    inner.style.height = (h * scale) + 'px';
    pct.textContent = Math.round(scale / (fitScale || 1) * 100) + '%';
  }
  function fit(keep) {
    var a4 = paper(); if (!a4) return;
    var w = a4.offsetWidth || 1750;
    fitScale = Math.max(0.05, (stage.clientWidth - 26) / w);
    if (!keep) put(fitScale);
    else put(scale);
  }

  /* ── 끌어서 옮기기 ── */
  var drag = null;
  stage.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, l: stage.scrollLeft, t: stage.scrollTop };
    stage.setPointerCapture(e.pointerId);
    stage.classList.add('drag');
  });
  stage.addEventListener('pointermove', function (e) {
    if (!drag) return;
    stage.scrollLeft = drag.l - (e.clientX - drag.x);
    stage.scrollTop = drag.t - (e.clientY - drag.y);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) {
    stage.addEventListener(t, function () { drag = null; stage.classList.remove('drag'); });
  });
  /* Ctrl + 휠 = 확대. 가리키는 자리를 붙잡고 키운다 */
  stage.addEventListener('wheel', function (e) {
    if (!e.ctrlKey) return;
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    var mx = e.clientX - r.left + stage.scrollLeft, my = e.clientY - r.top + stage.scrollTop;
    var before = scale;
    put(scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
    var k = scale / before;
    stage.scrollLeft = mx * k - (e.clientX - r.left);
    stage.scrollTop = my * k - (e.clientY - r.top);
  }, { passive: false });
  /* 두 번 누르면 폭 맞춤 ↔ 실제 크기 */
  stage.addEventListener('dblclick', function () { put(scale > fitScale * 1.2 ? fitScale : 1); });

  document.getElementById('zInB').onclick = function () { put(scale * 1.25); };
  document.getElementById('zOutB').onclick = function () { put(scale / 1.25); };
  document.getElementById('zFitB').onclick = function () { fit(false); };
  document.getElementById('zOneB').onclick = function () { put(1); };

  var ro = window.ResizeObserver ? new ResizeObserver(function () { fit(scale > fitScale * 1.05); }) : null;
  if (ro) ro.observe(stage);
  addEventListener('resize', function () { fit(scale > fitScale * 1.05); });

  function reload(i) { useEdition(i === 0 ? 1 : 0); useEdition(i); }

  window.CJK = {
    read: function () {
      return JSON.parse(JSON.stringify(EDITIONS.map(function (e) {
        return { key: e.key, cent: e.cent, y0: e.y0, y1: e.y1, book: e.book, desc: e.desc,
                 lanes: e.lanes, eras: e.eras, bars: e.bars, rulers_on: e.rulers_on,
                 ev: e.ev, links: e.links, sync: e.sync, notes: e.notes, memo: e.memo };
      })));
    },
    sheets: function () {
      return SHEETS.map(function (h, i) {
        return { i: i, label: h.label, cent: h.cent, ed: h.ed, y0: h.y0, y1: h.y1 };
      });
    },
    apply: function (ed, page) {
      var i = EDITIONS.findIndex(function (e) { return e.key === ed.key; });
      if (i < 0) return false;
      ['cent','y0','y1','book','desc','lanes','eras','bars','rulers_on','ev','links','sync','notes','memo']
        .forEach(function (k) { if (k in ed) EDITIONS[i][k] = ed[k]; });
      reload(i);
      this.show(page);
      return true;
    },
    show: function (page) {
      var keepScale = curPage === page ? scale : null;   // 같은 장을 다시 그릴 때는 보던 배율·자리를 지킨다
      var l = stage.scrollLeft, t = stage.scrollTop;
      curPage = Math.max(0, Math.min(SHEETS.length - 1, page | 0));
      openPage(curPage);
      requestAnimationFrame(function () {
        fit(true);
        if (keepScale) { put(keepScale); stage.scrollLeft = l; stage.scrollTop = t; }
        else put(fitScale);
        parent.postMessage({ cjk: 'drawn', page: curPage }, '*');
      });
    },
    /* 사건 하나를 가운데로 — 상세 페이지에서 고치는 사건이 어디 있는지 보여 준다 */
    focus: function (year) {
      var a4 = paper(); if (!a4) return;
      var svg = a4.querySelector('.a4-body');
      if (!svg) return;
      var h = SHEETS[curPage];
      if (!h || !(year >= h.y0 && year < h.y1)) return;
      var r = (year - h.y0) / (h.y1 - h.y0);
      stage.scrollTop = Math.max(0, (a4.offsetHeight * scale) * r - stage.clientHeight / 2);
    },
  };
  parent.postMessage({ cjk: 'ready' }, '*');
})();
</script>
</body>
</html>
