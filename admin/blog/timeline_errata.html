<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>1년연표 정오표 · Cheese Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../admin.css" />
  <link rel="stylesheet" href="timeline-errata.css" />
</head>

<body>
  <div class="admin-shell">
    <div id="admin-header-slot"></div>

    <div class="admin-main">
      <aside id="admin-menu-slot" class="admin-sidebar"></aside>

      <main>
        <header class="te-head">
          <div>
            <h1>1년연표 정오표</h1>
            <p>1년연표와 치즈위키(기사로 확인한 내용)의 날짜·내용이 다른 곳이에요. 처리 상태와 메모는 바꾸면 바로 저장돼요.</p>
          </div>
          <button type="button" class="te-btn primary" id="teAdd">+ 직접 추가</button>
        </header>

        <div class="te-chips" id="teChips"></div>

        <div class="te-tools">
          <select id="teChart"><option value="all">모든 해 1년연표</option></select>
          <input type="search" id="teSearch" placeholder="사건·내용·메모 검색">
          <span class="te-msg" id="teMsg"></span>
        </div>

        <div class="te-table-wrap">
          <table class="te-table">
            <thead>
              <tr><th>날짜</th><th>1년연표 → 치즈위키에서 확인된 내용</th><th>근거</th><th>처리 상태</th><th>메모</th></tr>
            </thead>
            <tbody id="teBody"><tr><td colspan="5" class="te-empty">불러오는 중…</td></tr></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <div class="te-modal" id="teModal">
    <div class="te-modal-box">
      <h3>정오표 줄 직접 추가</h3>
      <div class="te-field-row">
        <label class="te-field">1년연표(연도)<input name="chart" placeholder="2026"></label>
        <label class="te-field">확인된 날짜<input type="date" name="date"></label>
      </div>
      <label class="te-field">사건<input name="event" placeholder="코스피 9000"></label>
      <label class="te-field">1년연표에 적힌 것<input name="before" placeholder="6.19 코스피 9000"></label>
      <label class="te-field">확인된 내용<input name="after" placeholder="6.18 처음 9000을 넘겨 마감"></label>
      <label class="te-field">참고<input name="note"></label>
      <label class="te-field">근거 (한 줄에 하나: 주소만, 또는 매체 | 날짜 | 제목 | 주소)<textarea name="sources" rows="3"></textarea></label>
      <div class="te-modal-foot">
        <span class="te-msg" id="teFormMsg"></span>
        <button type="button" class="te-btn" id="teFormClose">닫기</button>
        <button type="button" class="te-btn primary" id="teFormSave">저장</button>
      </div>
    </div>
  </div>

  <script src="../admin-common.js"></script>
  <script src="timeline-errata.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.renderAdminHeader) window.renderAdminHeader({ mountId: 'admin-header-slot', badgeText: 'blog', subtitle: '1년연표 정오표' });
      if (window.renderAdminMenu) window.renderAdminMenu({ mountId: 'admin-menu-slot', active: 'timeline_errata' });
      if (window.TE_ERRATA) window.TE_ERRATA.init();
    });
  </script>
</body>

</html>
