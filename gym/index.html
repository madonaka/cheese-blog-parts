<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#1f6fd1" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>운동 코치</title>
  <link rel="stylesheet" href="./app.css?v=1" />
</head>
<body>
  <header class="top">
    <div class="top-date" id="topDate">불러오는 중</div>
    <div class="top-cost" id="topCost" title="이번 달 API 사용 요금(어림값)"></div>
  </header>

  <main>
    <!-- 오늘 -->
    <section class="view" id="view-today">
      <div class="card today-card" id="todayCard">
        <div class="today-head">
          <div class="seg" id="typeSeg" role="tablist" aria-label="루틴 고르기">
            <button data-type="A" role="tab">A루틴</button>
            <button data-type="B" role="tab">B루틴</button>
          </div>
          <span class="next-badge" id="nextBadge"></span>
          <button class="fold" id="foldBtn" aria-expanded="true">접기</button>
        </div>
        <ol class="ex-list" id="exList"></ol>
      </div>

      <div class="chat" id="chat" aria-live="polite"></div>

      <div class="quick" id="quick"></div>
      <form class="composer" id="composer">
        <label class="photo-btn" title="사진 보내기">
          <input type="file" accept="image/*" id="photoInput" hidden />
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9Zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>
          <span class="sr">사진</span>
        </label>
        <div class="photo-chip" id="photoChip" hidden><img id="photoThumb" alt="보낼 사진" /><button type="button" id="photoClear" aria-label="사진 빼기">×</button></div>
        <textarea id="input" rows="1" placeholder="예: 체스트 30키로 12번" autocomplete="off"></textarea>
        <button class="send" id="sendBtn" type="submit" aria-label="보내기">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg>
        </button>
      </form>
    </section>

    <!-- 기록 -->
    <section class="view" id="view-history" hidden>
      <div class="card">
        <div class="chart-head">
          <h2 id="chartTitle">종목별 무게 변화</h2>
          <select id="exSelect" aria-label="종목 고르기"></select>
        </div>
        <p class="chart-sub">그날 가장 무거운 세트의 무게</p>
        <div class="viz-root chart-wrap" id="chartWrap">
          <svg id="chart" role="img"></svg>
          <div class="tip" id="tip" hidden></div>
        </div>
        <details class="table-view">
          <summary>표로 보기</summary>
          <table id="chartTable"><thead><tr><th>날짜</th><th>세트</th></tr></thead><tbody></tbody></table>
        </details>
      </div>
      <h2 class="list-title">운동한 날</h2>
      <ol class="sessions" id="sessionList"></ol>
    </section>

    <!-- 루틴 -->
    <section class="view" id="view-routine" hidden>
      <div class="card" id="routineA"></div>
      <div class="card" id="routineB"></div>
      <div class="card">
        <h2>최근 몸 상태</h2>
        <ul class="body-log" id="bodyLog"></ul>
      </div>
      <div class="card">
        <h2>루틴이 바뀐 기록</h2>
        <ul class="body-log" id="changeLog"></ul>
      </div>
    </section>
  </main>

  <nav class="tabs" id="tabs">
    <button data-view="today" class="on">오늘</button>
    <button data-view="history">기록</button>
    <button data-view="routine">루틴</button>
  </nav>

  <!-- 종목 설명 -->
  <dialog class="sheet" id="sheet">
    <form method="dialog"><button class="sheet-close" aria-label="닫기">×</button></form>
    <h2 id="sheetTitle"></h2>
    <p class="sheet-ja" id="sheetJa"></p>
    <div class="motion" id="sheetMotion">동작 그림 자리 (다음 단계에서 넣습니다)</div>
    <ul class="cues" id="sheetCues"></ul>
    <p class="sheet-meta" id="sheetMeta"></p>
    <button class="primary" id="sheetGo">이거 할게</button>
  </dialog>

  <div class="login" id="login" hidden>
    <p>운동 코치는 운영자 계정으로만 쓸 수 있어요.</p>
    <button class="primary" id="loginBtn">구글 계정으로 로그인</button>
    <p class="login-msg" id="loginMsg"></p>
  </div>

  <script type="module" src="./app.js?v=1"></script>
</body>
</html>
