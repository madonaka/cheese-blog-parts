<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0e1726" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>운동 코치</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="./app.css?v=8" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span>운동 코치</div>
    <div class="top-cost" id="topCost" title="이번 달 API 사용 요금(어림값)"></div>
  </header>

  <main>
    <!-- 오늘 -->
    <section class="view" id="view-today">
      <div class="feed" id="feed">
        <section class="hero" id="hero"></section>
        <section class="week" id="week" aria-label="이번 주"></section>
        <section class="next-up" id="nextUp" hidden aria-live="polite"></section>

        <section class="card routine-card" id="todayCard">
          <div class="today-head">
            <div class="seg" id="typeSeg" role="tablist" aria-label="루틴 고르기">
              <button data-type="A" role="tab">A루틴</button>
              <button data-type="B" role="tab">B루틴</button>
            </div>
            <span class="progress-text" id="progressText"></span>
            <button class="fold" id="foldBtn" aria-expanded="true">접기</button>
          </div>
          <ol class="ex-list" id="exList"></ol>
        </section>

        <div class="chat" id="chat" aria-live="polite"></div>
      </div>

      <div class="dock">
        <div class="quick" id="quick"></div>
        <div class="listening" id="listening" hidden><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="listenText">듣고 있어요…</span></div>
        <form class="composer" id="composer">
          <label class="round-btn" title="사진 보내기">
            <input type="file" accept="image/*" id="photoInput" hidden />
            <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9Zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>
            <span class="sr">사진</span>
          </label>
          <div class="photo-chip" id="photoChip" hidden><img id="photoThumb" alt="보낼 사진" /><button type="button" id="photoClear" aria-label="사진 빼기">×</button></div>
          <textarea id="input" rows="1" placeholder="예: 30키로 12개" autocomplete="off"></textarea>
          <button class="round-btn mic" id="micBtn" type="button" aria-label="말로 하기" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6.5-3.5a1 1 0 1 0-2 0 4.5 4.5 0 0 1-9 0 1 1 0 1 0-2 0 6.5 6.5 0 0 0 5.5 6.42V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.08a6.5 6.5 0 0 0 5.5-6.42Z"/></svg>
          </button>
          <button class="send" id="sendBtn" type="submit" aria-label="보내기">
            <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg>
          </button>
        </form>
      </div>
    </section>

    <!-- 달력 -->
    <section class="view scroll" id="view-calendar" hidden><div id="calRoot"></div></section>

    <!-- 성장 -->
    <section class="view scroll" id="view-growth" hidden><div id="growthRoot"></div></section>

    <!-- 루틴 -->
    <section class="view scroll" id="view-routine" hidden>
      <div class="card" id="routineA"></div>
      <div class="card" id="routineB"></div>
      <div class="card">
        <h2>최근 몸 상태</h2>
        <ul class="plain-list" id="bodyLog"></ul>
      </div>
      <div class="card">
        <h2>루틴이 바뀐 기록</h2>
        <ul class="plain-list" id="changeLog"></ul>
      </div>
    </section>
  </main>

  <nav class="tabs" id="tabs">
    <button data-view="today" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>오늘</button>
    <button data-view="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>달력</button>
    <button data-view="growth"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19 10 13l4 4 6-9"/><path d="M15 8h5v5"/></svg>성장</button>
    <button data-view="routine"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>루틴</button>
  </nav>

  <!-- 종목 설명 -->
  <dialog class="sheet" id="sheet">
    <form method="dialog"><button class="sheet-close" aria-label="닫기">×</button></form>
    <p class="sheet-part" id="sheetPart"></p>
    <h2 id="sheetTitle"></h2>
    <p class="sheet-ja" id="sheetJa"></p>
    <div class="motion" id="sheetMotion">동작 그림은 다음 단계에서 넣습니다</div>
    <ul class="cues" id="sheetCues"></ul>
    <div class="sheet-stats" id="sheetStats"></div>
    <button class="primary" id="sheetGo">이거 할게</button>
  </dialog>

  <script src="./util.js?v=6"></script>
  <script src="./calendar.js?v=6"></script>
  <script src="./muscle.js?v=6"></script>
  <script src="./photos.js?v=6"></script>
  <script src="./bodyshape.js?v=8"></script>
  <script src="./growth.js?v=6"></script>
  <script src="./app.js?v=6"></script>
</body>
</html>
