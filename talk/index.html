<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#14213d" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>일본어 회화반</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="./app.css?v=6" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">話</span>일본어 회화반</div>
    <div class="top-right">
      <span class="rank-badge" id="rankBadge"></span>
      <span class="top-cost" id="topCost" title="이번 달 API 사용 요금(어림값)"></span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="home" class="on">홈</button>
    <button data-view="lesson">수업</button>
    <button data-view="read">읽기</button>
    <button data-view="record">성적표</button>
    <button data-view="weak">약점 노트</button>
  </nav>

  <main>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-lesson" hidden>
      <div class="lesson-head" id="lessonHead"></div>
      <div class="feed" id="feed" aria-live="polite"></div>
      <div class="dock" id="dock">
        <div class="live" id="live" hidden><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="liveText">듣고 있어요. 멈춰 생각해도 안 끊겨요. 다 말하면 다시 누르세요</span></div>
        <form class="composer" id="composer">
          <button type="button" class="ghost-btn" id="endBtn">끝내기</button>
          <textarea id="input" rows="1" placeholder="일본어로 말하거나 적기" autocomplete="off" lang="ja"></textarea>
          <button type="submit" class="send" id="sendBtn" aria-label="보내기">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg>
          </button>
          <button type="button" class="mic" id="micBtn" aria-label="말하기" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6.5-3.5a1 1 0 1 0-2 0 4.5 4.5 0 0 1-9 0 1 1 0 1 0-2 0 6.5 6.5 0 0 0 5.5 6.42V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.08a6.5 6.5 0 0 0 5.5-6.42Z"/></svg>
          </button>
        </form>
      </div>
    </section>
    <section class="view" id="view-read" hidden></section>
    <section class="view" id="view-record" hidden></section>
    <section class="view" id="view-weak" hidden></section>
  </main>

  <div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" hidden></div>

  <script src="./app.js?v=7"></script>
</body>
</html>
