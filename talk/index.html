<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>일본어 회화반</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="./app.css?v=39" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">話</span>일본어 회화반</div>
    <div class="top-right">
      <span class="rank-badge" id="rankBadge"></span>
      <span class="top-cost" id="topCost" title="이번 달 API 사용 요금(어림값)"></span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="home" class="on"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></i><span>홈</span></button>
    <button data-view="course"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></i><span>코스</span></button>
    <button data-view="lesson"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.5L3 21l1.5-5.1A8.5 8.5 0 1 1 21 12Z"/></svg></i><span>수업</span></button>
    <button data-view="read"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="2"/><rect x="17" y="14" width="4" height="6" rx="2"/></svg></i><span>듣기·읽기</span></button>
    <button data-view="record"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M7 15v-4M12 15V7M17 15v-6"/></svg></i><span>성적표</span></button>
    <button data-view="weak"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5v-13Z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></svg></i><span>단어장</span></button>
  </nav>

  <main>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-lesson" hidden>
      <div class="lesson-head" id="lessonHead"></div>
      <div class="feed" id="feed" aria-live="polite"></div>
      <div class="dock" id="dock">
        <div class="live" id="live" hidden><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="liveText">듣고 있어요. 멈춰 생각해도 안 끊겨요. 다 말하면 다시 누르세요</span><button type="button" class="live-cancel" id="liveCancel">취소</button></div>
        <div class="review-bar" id="reviewBar" hidden><span class="rv-hint"></span><button type="button" class="ghost-btn" id="rvCancel">지우기</button><button type="button" class="ghost-btn" id="rvRetry">🎤 다시 말하기</button><button type="button" class="send-txt" id="rvSend">보내기 ▶</button></div>
        <form class="composer" id="composer">
          <button type="button" class="ghost-btn" id="endBtn">끝내기</button>
          <textarea id="input" rows="1" placeholder="일본어로 말하거나 적기" autocomplete="off" lang="ja"></textarea>
          <button type="submit" class="send" id="sendBtn" aria-label="보내기">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg>
          </button>
          <button type="button" class="mic" id="micBtn" aria-label="말하기" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6.5-3.5a1 1 0 1 0-2 0 4.5 4.5 0 0 1-9 0 1 1 0 1 0-2 0 6.5 6.5 0 0 0 5.5 6.42V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.08a6.5 6.5 0 0 0 5.5-6.42Z"/></svg>
          </button>
        </form>
      </div>
    </section>
    <section class="view" id="view-course" hidden></section>
    <section class="view" id="view-read" hidden></section>
    <section class="view" id="view-record" hidden></section>
    <section class="view" id="view-weak" hidden></section>
  </main>

  <div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" hidden></div>

  <script src="./app.js?v=47"></script>
</body>
</html>
